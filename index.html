<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaurant Atlas</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f4f4f4;
padding:15px;
margin:0;
}

h1{
text-align:center;
margin-bottom:20px;
}

.produit{
background:white;
border-radius:15px;
padding:15px;
margin-bottom:20px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.produit img{
width:100%;
border-radius:10px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

.panier{
background:white;
border-radius:15px;
padding:15px;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

</style>
</head>

<body>

<h1>🍔 Restaurant Atlas</h1>

<div class="produit">
<h2>🍔 Burgers</h2>

<div class="produit">
<h3>Double Burger</h3>
<p>75 DH</p>
<button onclick="ajouter('Double Burger',75)">Ajouter</button>
</div>

<div class="produit">
<h3>Chicken Burger</h3>
<p>65 DH</p>
<button onclick="ajouter('Chicken Burger',65)">Ajouter</button>
</div>

<h2>🌮 Tacos</h2>

<div class="produit">
<h3>Tacos Poulet</h3>
<p>55 DH</p>
<button onclick="ajouter('Tacos Poulet',55)">Ajouter</button>
</div>

<div class="produit">
<h3>Tacos Viande</h3>
<p>65 DH</p>
<button onclick="ajouter('Tacos Viande',65)">Ajouter</button>
</div>

<h2>🥤 Boissons</h2>

<div class="produit">
<h3>Coca-Cola</h3>
<p>10 DH</p>
<button onclick="ajouter('Coca-Cola',10)">Ajouter</button>
</div>

<div class="panier">

<h2>Panier</h2>

<ul id="liste"></ul>

<p>
Total :
<span id="total">0</span> DH
</p>

<button onclick="commander()">
Commander sur WhatsApp
</button>

</div>

<script>

let panier=[];
let total=0;

function ajouter(nom,prix){

panier.push(nom);

total+=prix;

document.getElementById("total").innerText=total;

let li=document.createElement("li");

li.innerText=nom;

document.getElementById("liste").appendChild(li);

}

function commander(){

let message="Bonjour,%0A%0AJe souhaite commander :%0A";

panier.forEach(item=>{
message+="- "+item+"%0A";
});

message+="%0ATotal : "+total+" DH";

window.open(
"https://wa.me/212600000000?text="+message
);

}

</script>

</body>
</html>
